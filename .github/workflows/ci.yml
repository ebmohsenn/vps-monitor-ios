name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        # /Applications/Xcode.app is the runner image's default Xcode.
        # To pin a version, point this at e.g. /Applications/Xcode_16.4.app.
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Show schemes
        run: xcodebuild -project VPSMonitor.xcodeproj -list

      - name: Build app and widget
        run: |
          set -o pipefail
          xcodebuild \
            -project VPSMonitor.xcodeproj \
            -scheme VPSMonitor \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      # The project has no unit test targets yet. When one is added to the
      # VPSMonitor scheme, add a step here that runs
      #   xcodebuild test -project VPSMonitor.xcodeproj -scheme VPSMonitor \
      #     -destination 'platform=iOS Simulator,name=<an installed iPhone>' CODE_SIGNING_ALLOWED=NO

      - name: Check reference server syntax
        run: python3 -m py_compile server/vps_status_server.py
